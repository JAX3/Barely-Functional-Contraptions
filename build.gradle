plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    maven {
        // JEI (optional integration)
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
            includeGroup 'net.mezzdev.config' // JEI 31+ runtime dependency
        }
    }
    maven {
        // Jade (optional integration)
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

base {
    archivesName = mod_id
}

// Minecraft 26.3 ships Java 25, so mods target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // Player name in the dev client (offline name only, no login).
            if (project.hasProperty('dev_username') && !project.dev_username.toString().isBlank()) {
                programArguments.addAll '--username', project.dev_username.toString()
            }
            // ./gradlew runClient -PscreenshotHarness : stages a test world, captures screenshots, quits (see DevScreenshotHarness)
            if (project.hasProperty('screenshotHarness')) {
                systemProperty 'barelyfunctionalcontraptions.screenshotHarness', 'true'
                if (project.hasProperty('harnessScene')) {
                    systemProperty 'barelyfunctionalcontraptions.screenshotHarness.scene', project.property('harnessScene')
                }
                // -PharnessWorld=<folder in run/saves>: open that world instead of making a fresh one (scene extend_world)
                if (project.hasProperty('harnessWorld')) {
                    systemProperty 'barelyfunctionalcontraptions.screenshotHarness.world', project.property('harnessWorld')
                }
                programArguments.addAll '--width', '1280', '--height', '720'
            }
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Runs every GameTest of both modules on a headless server and exits with a non-zero code on failure.
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // Puts Minecraft/NeoForge on the unit-test classpath (src/test).
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

// 'localRuntime': present in the dev runs but not published as a dependency (as in the NeoForge MDK).
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // JEI: compile against the API only, so the mod has no hard dependency on JEI.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    if (project.use_jei_runtime.toBoolean()) {
        localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    }

    // Jade: no separate API jar, so compile against the mod; dev runs only, never bundled or published.
    compileOnly "maven.modrinth:jade:${jade_version}"
    localRuntime "maven.modrinth:jade:${jade_version}"

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

// Expands the properties above into neoforge.mods.toml.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            jei_version_range      : jei_version_range,
            jade_version_range     : jade_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:deprecation'
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors
        ])
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
