plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

// The Minecraft version to build for: ./gradlew build -Pmc=26.2 or -Pmc=26.1 (default 26.3). Each one has a versions/<mc>.properties
// file (Minecraft, NeoForge, JEI and Jade versions) and a src/mc/<mc> folder of the few classes and data files that differ
// between versions; everything else in src/main is shared.
def mc = (findProperty('mc') ?: '26.3').toString()
def mcProps = file("versions/${mc}.properties")
if (!mcProps.exists()) {
    throw new GradleException("Unsupported Minecraft version '${mc}': there is no versions/${mc}.properties")
}
def mcValues = new Properties()
mcProps.withInputStream { mcValues.load(it) }
mcValues.each { key, value -> project.ext.set(key.toString(), value.toString()) }
def defaultMc = mc == '26.3'

// The jar says which Minecraft it is for: barelyfunctionalcontraptions-1.5.5-mc26.2.jar
version = "${mod_version}-mc${mc}"
group = mod_group_id
// Each Minecraft version builds in its own folder and runs in its own game folder, so switching doesn't redo the other's
// setup or open a world in an older version. 26.3 keeps build/ and run/.
if (!defaultMc) layout.buildDirectory = file("build/mc${mc}")

repositories {
    mavenLocal()
    maven {
        // JEI (optional integration)
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
            includeGroup 'net.mezzdev.config' // JEI 31+ runtime dependency
        }
    }
    maven {
        // Jade (optional integration)
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

base {
    archivesName = mod_id
}

// Minecraft 26.3 ships Java 25, so mods target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // Player name in the dev client (offline name only, no login).
            if (project.hasProperty('dev_username') && !project.dev_username.toString().isBlank()) {
                programArguments.addAll '--username', project.dev_username.toString()
            }
            // ./gradlew runClient -PscreenshotHarness : stages a test world, captures screenshots, quits (see DevScreenshotHarness)
            if (project.hasProperty('screenshotHarness')) {
                systemProperty 'barelyfunctionalcontraptions.screenshotHarness', 'true'
                if (project.hasProperty('harnessScene')) {
                    systemProperty 'barelyfunctionalcontraptions.screenshotHarness.scene', project.property('harnessScene')
                }
                // -PharnessWorld=<folder in run/saves>: open that world instead of making a fresh one (scene extend_world)
                if (project.hasProperty('harnessWorld')) {
                    systemProperty 'barelyfunctionalcontraptions.screenshotHarness.world', project.property('harnessWorld')
                }
                // -PharnessJfr=<file>: record a Java Flight Recorder profile of the run (scene perf)
                if (project.hasProperty('harnessJfr')) {
                    jvmArgument "-XX:StartFlightRecording=filename=${project.property('harnessJfr')},settings=profile"
                }
                // -PharnessWidth / -PharnessHeight: a bigger window (the cover banner is shot at 1920x1080)
                programArguments.addAll '--width', (project.findProperty('harnessWidth') ?: '1280').toString(),
                        '--height', (project.findProperty('harnessHeight') ?: '720').toString()
            }
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Runs every GameTest of both modules on a headless server and exits with a non-zero code on failure.
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            gameDirectory = project.file(defaultMc ? 'run' : "run-${mc}")
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // Puts Minecraft/NeoForge on the unit-test classpath (src/test).
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

sourceSets.main.java.srcDir "src/mc/${mc}/java"
sourceSets.main.resources.srcDir "src/mc/${mc}/resources"

// The loot tables and advancements in src/main are in 26.3's data format; the 26.2 and 26.1 builds convert them as they copy them
// (see buildSrc/src/main/groovy/McDataDowngrade.groovy).
if (mc == '26.2' || mc == '26.1') {
    tasks.named('processResources', ProcessResources).configure {
        filesMatching(['data/*/loot_table/**/*.json', 'data/*/advancement/**/*.json']) {
            filter(McDataDowngrade)
        }
    }
}

// 'localRuntime': present in the dev runs but not published as a dependency (as in the NeoForge MDK).
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // JEI: compile against the API only, so the mod has no hard dependency on JEI.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    if (project.use_jei_runtime.toBoolean()) {
        localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    }

    // Jade: no separate API jar, so compile against the mod; dev runs only, never bundled or published.
    compileOnly "maven.modrinth:jade:${jade_version}"
    localRuntime "maven.modrinth:jade:${jade_version}"

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

// Expands the properties above into neoforge.mods.toml.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            jei_version_range      : jei_version_range,
            jade_version_range     : jade_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:deprecation'
}

jar {
    // -PjarDir=<folder>: put the finished jar there instead of build/libs (for example your Minecraft mods folder, or set
    // jarDir=... in your own ~/.gradle/gradle.properties to make it your default). Each jar's name says its Minecraft
    // version, so every version can share one folder.
    if (project.hasProperty('jarDir')) {
        destinationDirectory = file(project.property('jarDir').toString())
    }
    // Dev tools stay out of the released jar so the game doesn't load them: the GameTests with their test data,
    // and the screenshot harness. Dev runs (runClient, runGameTestServer) use the build folders and keep them.
    exclude 'com/jax3/barelyfunctionalcontraptions/gametest/**',
            'com/jax3/barelyfunctionalcontraptions/*/gametest/**',
            'com/jax3/barelyfunctionalcontraptions/sheep/client/DevScreenshotHarness*',
            'com/jax3/barelyfunctionalcontraptions/compat/McTest*',
            'data/barelyfunctionalcontraptions/test_instance/**',
            'data/barelyfunctionalcontraptions/test_environment/**',
            'data/barelyfunctionalcontraptions/structure/**'
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors
        ])
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
