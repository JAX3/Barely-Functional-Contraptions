org.gradle.jvmargs=-Xmx8G
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=true

## Environment
minecraft_version=26.3
minecraft_version_range=[26.3]
neo_version=26.3.0.101
neo_version_range=[26.3,)
loader_version_range=[4,)

## Dev client
# Player name used by `gradlew runClient` (offline name only, no login, default skin). Empty = "Dev".
dev_username=Clown95x

## Optional dependencies
# JEI: https://maven.blamejared.com/mezz/jei/
jei_version=31.17.0.109
jei_version_range=[31.0,)
# Jade: https://modrinth.com/mod/jade (Modrinth maven, version "<mod>+neoforge")
jade_version=26.3.5+neoforge
jade_version_range=[26.3,)
# Set to false to launch the dev client/server WITHOUT JEI (to verify the mod runs without it).
use_jei_runtime=true

## Mod properties
mod_id=barelyfunctionalcontraptions
mod_name=Barely Functional Contraptions
mod_license=MIT
mod_version=1.5.0
mod_group_id=com.jax3.barelyfunctionalcontraptions
mod_authors=JAX3
mod_description=Mushroom-and-water Mycelial Generators whose Forge Energy output grows exponentially across networks, and resource-infused sheep whose wool a Mechanical Separator turns back into ores, gems and mushrooms. The generators power the separators, and mushroom wool feeds the generators.
